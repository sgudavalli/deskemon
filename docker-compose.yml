services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=deskemon
      - POSTGRES_USER=deskemon
      - POSTGRES_PASSWORD=deskemon
    volumes:
      - deskemon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskemon -d deskemon"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://deskemon:deskemon@postgres:5432/deskemon
      # Routine nudge intervals/toggles now live in Postgres (routine_configs
      # table, seeded on first boot) and are editable via /routines and the
      # Control Center UI instead of env vars.
      # Motion-detection sensitivity for real Sensor Logger accelerometer
      # data (m/s^2 deviation from gravity to count as "moving").
      - SENSOR_LOGGER_MOTION_THRESHOLD_MS2=1.5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulator:
    build: ./simulator
    environment:
      - BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  frontend-companion-app:
    # The animated companion is the user-facing product and visual source of truth.
    build: ./frontend-companion-app
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  frontend-monitor-app:
    # Engineering-only surface for inspecting raw events and generated nudges.
    build: ./frontend-monitor-app
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy

  frontend-dashboard-app:
    # Deskemon Control Center — routine/reminder configuration UI.
    build: ./frontend-dashboard-app
    ports:
      - "5175:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  deskemon-pgdata:
